<script>
(function(){
'use strict';

// ==========================================
// Samozalwheel - Real Mini App
// اتصال به wp و wheelspinreal
// ==========================================

// ۱. فهرست جوایز

const prizes = [
  {code:'P1', label:['VPN','۴ گیگ']},
  {code:'P2', label:['شارژ','۱۰ هزار']},
  {code:'P3', label:['VPN','۲ گیگ']},
  {code:'P4', label:['شارژ','۵ هزار']},
  {code:'P5', label:['VPN','۱ گیگ']},
  {code:'P6', label:['شارژ ویژه','۱۰۰ هزار']},
  {code:'P7', label:['اینترنت','۱ ماهه']},
  {code:'P8', label:['حاکم','سناریو']},
  {code:'P9', label:['شانس','اضافی']},
  {code:'P10', label:['شارژ','۲۰ هزار']},
  {code:'P11', label:['شارژ','۵۰ هزار']},
  {code:'P12', label:['شارژ','۸۰ هزار']}
];

// ۲. دریافت عناصر صفحه

const svg = document.getElementById('wheel');
const profileMessage = document.getElementById('profileMessage');
const profileChances = document.getElementById('profileChances');
const profileGames = document.getElementById('profileGames');
const status = document.getElementById('status');
const spinBtn = document.getElementById('spinBtn');

const tg = window.Telegram && window.Telegram.WebApp;

const params = new URLSearchParams(window.location.search);

const profileApiUrl = params.get('api');
const spinApiUrl = params.get('spinapi');

const NS = 'http://www.w3.org/2000/svg';

// ۳. وضعیت داخلی گردونه

let spinning = false;
let currentRotation = 0;
let profileLoaded = false;
let remainingChances = 0;

// ۴. ابزار ساخت SVG

function el(tag, attrs = {}, text){

  const node = document.createElementNS(NS, tag);

  Object.entries(attrs).forEach(([key,value])=>{
    node.setAttribute(key,value);
  });

  if(text !== undefined){
    node.textContent = text;
  }

  return node;
}

function point(radius, angle){

  const radians = (angle-90)*Math.PI/180;

  return [
    250 + radius*Math.cos(radians),
    250 + radius*Math.sin(radians)
  ];
}

// ۵. ساخت گردونه ۱۲ قسمتی

function buildWheel(){

  svg.innerHTML = '';

  const group = el('g',{id:'slices'});

  const colors = [
    '#8f1422','#17171d','#b02230','#242027',
    '#74131e','#19191f','#a51e2a','#252027',
    '#821521','#17171d','#a51e2a','#252027'
  ];

  prizes.forEach((prize,index)=>{

    const start = index*30;
    const end = start+30;

    const [x1,y1] = point(239,start);
    const [x2,y2] = point(239,end);

    group.appendChild(el('path',{
      d:
        `M 250 250 L ${x1} ${y1} ` +
        `A 239 239 0 0 1 ${x2} ${y2} Z`,
      fill:colors[index],
      stroke:'#e5bd69',
      'stroke-width':'2.5'
    }));

    const middle = start+15;

    const [tx,ty] = point(154,middle);

    let textRotation = middle;

    if(middle>90 && middle<270){
      textRotation += 180;
    }

    const textGroup = el('g',{
      transform:
        `translate(${tx} ${ty}) rotate(${textRotation})`
    });

    const text = el('text',{
      x:0,
      y:0,
      'text-anchor':'middle',
      'dominant-baseline':'middle',
      fill:'#fff3d8',
      'font-family':'Tahoma,Arial,sans-serif',
      'font-size':21,
      'font-weight':'700',
      'paint-order':'stroke',
      stroke:'#140a0d',
      'stroke-width':'2.6',
      'stroke-linejoin':'round'
    });

    prize.label.forEach((line,lineIndex)=>{

      text.appendChild(el('tspan',{
        x:0,
        dy:lineIndex===0 ? '-0.52em' : '1.15em'
      },line));

    });

    textGroup.appendChild(text);
    group.appendChild(textGroup);

  });

  svg.appendChild(group);

  svg.appendChild(el('circle',{
    cx:250,
    cy:250,
    r:244,
    fill:'none',
    stroke:'#f0ce7a',
    'stroke-width':'4'
  }));

  svg.appendChild(el('circle',{
    cx:250,
    cy:250,
    r:88,
    fill:'none',
    stroke:'#e8c46f',
    'stroke-width':'2',
    'stroke-opacity':'.7'
  }));

  svg.style.transformOrigin = '50% 50%';
}

// ۶. بررسی پاسخ JSON

async function readApiResponse(response){

  const text = await response.text();

  let data;

  try{
    data = JSON.parse(text);
  }catch(error){
    throw new Error(
      'پاسخ سرور JSON معتبر نیست.'
    );
  }

  if(!response.ok){
    throw new Error(
      data.message ||
      'خطای ارتباط با سرور: ' + response.status
    );
  }

  return data;
}

// ۷. نمایش اطلاعات پروفایل

function updateProfileDisplay(data){

  remainingChances = Number(data.chances);

  if(!Number.isFinite(remainingChances)){
    remainingChances = 0;
  }

  const games = Number(data.samozal_games) || 0;

  profileMessage.textContent =
    '✅ اطلاعات حساب دریافت شد.';

  profileChances.textContent =
    '🎟️ شانس باقی‌مانده: ' + remainingChances;

  profileGames.textContent =
    '🎮 تعداد بازی‌ها: ' + games;

  profileLoaded = true;

  if(remainingChances>0){

    spinBtn.disabled = false;
    spinBtn.style.opacity = '1';

    spinBtn.textContent =
      '🎲 چرخاندن گردونه';

    status.textContent =
      'برای دریافت جایزه، گردونه را بچرخان.';

  }else{

    spinBtn.disabled = true;
    spinBtn.style.opacity = '.7';

    spinBtn.textContent =
      '🎲 شانس کافی ندارید';

    status.textContent =
      'در حال حاضر شانس فعالی برای چرخش ندارید.';
  }
}

// ۸. دریافت پروفایل از Webhook wp

async function loadProfile(){

  spinBtn.disabled = true;
  spinBtn.style.opacity = '.7';

  if(!tg){

    profileMessage.textContent =
      '❌ محیط تلگرام شناسایی نشد.';

    status.textContent =
      'لطفاً صفحه را از داخل تلگرام باز کن.';

    return;
  }

  tg.ready();

  if(!tg.initData){

    profileMessage.textContent =
      '❌ اطلاعات راه‌اندازی تلگرام دریافت نشد.';

    status.textContent =
      'صفحه باید به‌عنوان Mini App باز شود.';

    return;
  }

  if(!profileApiUrl){

    profileMessage.textContent =
      '❌ لینک دریافت پروفایل وجود ندارد.';

    status.textContent =
      'لینک اختصاصی گردونه ناقص است.';

    return;
  }

  profileMessage.textContent =
    'در حال دریافت اطلاعات حساب...';

  try{

    const response = await fetch(profileApiUrl,{
      method:'GET',
      cache:'no-store'
    });

    const data = await readApiResponse(response);

    if(data.ok !== true){
      throw new Error(
        data.message || 'دریافت پروفایل ناموفق بود.'
      );
    }

    if(data.profile_found !== true){

      profileMessage.textContent =
        '⚠️ پروفایل شما در سیستم پیدا نشد.';

      status.textContent =
        'ابتدا باید پروفایل شما ثبت شده باشد.';

      return;
    }

    const telegramUser =
      tg.initDataUnsafe && tg.initDataUnsafe.user;

    if(
      telegramUser &&
      Number(data.user_id) !== Number(telegramUser.id)
    ){
      throw new Error(
        'شناسه کاربر با پروفایل دریافتی مطابقت ندارد.'
      );
    }

    updateProfileDisplay(data);

  }catch(error){

    profileLoaded = false;

    profileMessage.textContent =
      '❌ دریافت اطلاعات حساب ناموفق بود.';

    status.textContent =
      error.message || 'خطای ارتباط با سرور.';

    console.error('Profile API error:',error);
  }
}

// ۹. انیمیشن رسیدن به جایزه

function animateToPrize(prizeCode){

  return new Promise((resolve,reject)=>{

    const index = prizes.findIndex(
      prize => prize.code === prizeCode
    );

    if(index === -1){
      reject(new Error('کد جایزه در گردونه پیدا نشد.'));
      return;
    }

    const prizeCenter = index*30+15;

    const targetAngle =
      (360-prizeCenter+360)%360;

    const currentAngle =
      ((currentRotation%360)+360)%360;

    const adjustment =
      (targetAngle-currentAngle+360)%360;

    const extraTurns = 6*360;

    currentRotation += extraTurns+adjustment;

    svg.style.transition =
      'transform 6s cubic-bezier(0.12,0.75,0.12,1)';

    let finished = false;

    function finish(){

      if(finished) return;

      finished = true;

      svg.removeEventListener(
        'transitionend',
        onTransitionEnd
      );

      resolve();
    }

    function onTransitionEnd(event){

      if(event.target === svg){
        finish();
      }
    }

    svg.addEventListener(
      'transitionend',
      onTransitionEnd
    );

    svg.style.transform =
      'rotate(' + currentRotation + 'deg)';

    setTimeout(finish,7000);

  });
}

// ۱۰. اجرای چرخش واقعی

async function spinWheel(){

  if(spinning) return;

  if(!profileLoaded){

    status.textContent =
      'ابتدا باید اطلاعات پروفایل دریافت شود.';

    return;
  }

  if(remainingChances<=0){

    status.textContent =
      '❌ شانس کافی برای چرخش ندارید.';

    return;
  }

  if(!spinApiUrl){

    status.textContent =
      '❌ لینک چرخش گردونه موجود نیست.';

    return;
  }

  spinning = true;

  spinBtn.disabled = true;
  spinBtn.textContent = '⏳ در حال چرخش...';

  status.textContent =
    'در حال ثبت چرخش و دریافت جایزه...';

  try{

    const response = await fetch(spinApiUrl,{
      method:'GET',
      cache:'no-store'
    });

    const data = await readApiResponse(response);

    if(data.ok !== true){
      throw new Error(
        data.message || 'چرخش گردونه ناموفق بود.'
      );
    }

    if(!data.prize || !data.prize.code){
      throw new Error(
        'اطلاعات جایزه از سرور دریافت نشد.'
      );
    }

    const selectedPrize = prizes.find(
      prize => prize.code === data.prize.code
    );

    if(!selectedPrize){
      throw new Error(
        'کد جایزهٔ دریافتی معتبر نیست.'
      );
    }

    await animateToPrize(selectedPrize.code);

    status.textContent =
      '🎉 تبریک! جایزه شما: ' + data.prize.name;

    remainingChances = Number(data.chances);

    if(!Number.isFinite(remainingChances)){
      remainingChances = 0;
    }

    profileChances.textContent =
      '🎟️ شانس باقی‌مانده: ' + remainingChances;

    if(data.samozal_games !== undefined){

      profileGames.textContent =
        '🎮 تعداد بازی‌ها: ' +
        (Number(data.samozal_games)||0);
    }

    profileMessage.textContent =
      '✅ جایزه با موفقیت در سیستم ثبت شد.';

    if(tg && tg.HapticFeedback){

      tg.HapticFeedback.notificationOccurred(
        'success'
      );
    }

    if(remainingChances>0){

      spinBtn.textContent =
        '🎲 چرخاندن دوباره';

    }else{

      spinBtn.textContent =
        '🎲 شانس شما تمام شد';
    }

  }catch(error){

    status.textContent =
      '❌ ' + (
        error.message ||
        'خطا در اجرای چرخش گردونه.'
      );

    console.error('Spin API error:',error);

    await loadProfile();

  }finally{

    spinning = false;

    if(profileLoaded && remainingChances>0){

      spinBtn.disabled = false;
      spinBtn.style.opacity = '1';

      if(
        spinBtn.textContent !==
        '🎲 چرخاندن دوباره'
      ){
        spinBtn.textContent =
          '🎲 چرخاندن گردونه';
      }

    }else{

      spinBtn.disabled = true;
      spinBtn.style.opacity = '.7';
    }
  }
}

// ۱۱. راه‌اندازی نهایی

buildWheel();

spinBtn.addEventListener(
  'click',
  spinWheel
);

if(tg){

  tg.ready();
  tg.expand();
}

loadProfile();

})();
</script>
