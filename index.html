<!doctype html>

<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090d">
<title>گردونه مافیایی | سام و زال</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{
  --gold:#f0ce7a;
  --cream:#fff3d8;
  --red:#a7192a;
  --dark:#111116;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:var(--cream);
  font-family:Tahoma,Arial,sans-serif;
  background:radial-gradient(ellipse at 50% 25%,#42131a 0%,#1a1218 42%,#07070a 100%);
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.12;
  background-image:radial-gradient(#e7bd69 .7px,transparent .7px);
  background-size:19px 19px;
}
.wrap{
  width:min(100%,720px);
  margin:auto;
  padding:25px 14px 32px;
  position:relative;
}
header{text-align:center;margin-bottom:20px}
.kicker{
  font-size:11px;
  letter-spacing:3px;
  color:var(--gold);
  font-weight:bold;
  margin-bottom:9px;
}
h1{
  font-size:clamp(28px,6vw,42px);
  margin:0;
  color:#fff0cf;
  text-shadow:0 2px 0 #68101b,0 0 22px #b51b2b66;
}
.rule{
  height:1px;
  width:150px;
  margin:15px auto;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.subtitle{
  color:#d1c0a9;
  font-size:13px;
  line-height:1.9;
}
.panel{
  border:1px solid #b58b4b77;
  background:linear-gradient(145deg,#1c171cf2,#09090def);
  border-radius:24px;
  padding:clamp(12px,3vw,24px);
  box-shadow:0 22px 70px #0009,inset 0 1px #fff1;
}
.stage{
  width:min(100%,500px);
  aspect-ratio:1;
  margin:0 auto 20px;
  position:relative;
  filter:drop-shadow(0 16px 24px #000b);
}
.rim{
  position:absolute;
  inset:0;
  border-radius:50%;
  padding:8px;
  background:linear-gradient(135deg,#fff0b5,#8c622b 25%,#f6d98d 45%,#68451f 68%,#e8c46f);
  box-shadow:0 0 0 3px #171015,0 0 0 5px #bd8d43,0 0 26px #d29b4540;
}
#wheel{
  width:100%;
  height:100%;
  display:block;
  border-radius:50%;
  transform:rotate(0deg);
}
.pointer{
  position:absolute;
  z-index:5;
  top:-2px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:18px solid transparent;
  border-right:18px solid transparent;
  border-top:0;
  border-bottom:34px solid #f4d78e;
  filter:drop-shadow(0 3px 2px #000);
}
.pointer:after{
  content:"";
  position:absolute;
  left:-9px;
  top:8px;
  border-left:9px solid transparent;
  border-right:9px solid transparent;
  border-bottom:18px solid #921524;
}
.hub{
  position:absolute;
  z-index:4;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:20%;
  aspect-ratio:1;
  border-radius:50%;
  border:4px solid #e6c16e;
  background:radial-gradient(circle at 35% 25%,#432226,#100d12 72%);
  box-shadow:0 0 0 4px #180f12,0 0 0 6px #a67b37,0 0 22px #000b;
  display:grid;
  place-items:center;
  text-align:center;
  color:var(--gold);
  font-size:clamp(9px,2.5vw,14px);
  font-weight:bold;
  line-height:1.35;
}
.hub .suits{
  font-size:clamp(15px,4vw,23px);
  line-height:1.1;
  display:block;
}
.controls{text-align:center}
.spin{
  border:1px solid #f3d58e;
  border-radius:999px;
  padding:14px 32px;
  min-width:215px;
  background:linear-gradient(180deg,#b52b35,#71121c);
  color:#fff5df;
  font:bold 17px Tahoma,Arial,sans-serif;
  opacity:.7;
  cursor:pointer;
}
.spin:disabled{cursor:not-allowed}
.status{
  min-height:27px;
  margin-top:16px;
  color:#d8c8ad;
  font-size:13px;
  line-height:1.8;
}
.note{
  text-align:center;
  color:#a89a89;
  font-size:10px;
  line-height:1.9;
  max-width:520px;
  margin:17px auto 0;
}
footer{
  text-align:center;
  margin-top:20px;
  color:#b38b4e;
  font-size:11px;
  letter-spacing:1px;
}
.profile-box{
  text-align:center;
  margin:0 auto 18px;
  padding:13px;
  border:1px solid #b58b4b77;
  border-radius:16px;
  background:#09090d88;
  max-width:440px;
  line-height:2;
}
.profile-message{font-size:12px;color:#d1c0a9}
.profile-chances{font-size:20px;font-weight:bold;color:var(--gold)}
.profile-games{font-size:12px;color:#d1c0a9}
.result{
  display:none;
  margin:15px auto 0;
  padding:15px;
  max-width:440px;
  border:1px solid #d6ad61;
  border-radius:15px;
  background:#2b1a1c;
  text-align:center;
}
.result.show{display:block}
.result-title{font-size:18px;color:var(--gold);font-weight:bold}
.result-desc{font-size:12px;color:#e8d8bd;margin-top:8px;line-height:1.9}
@media(max-width:380px){
  .rim{padding:5px}
  .pointer{
    border-left-width:15px;
    border-right-width:15px;
    border-bottom-width:29px;
  }
}
</style></head><body>
<div class="wrap"><header>
  <div class="kicker">THE UNDERWORLD • SAM &amp; ZAL</div>
  <h1>گردونهٔ مافیایی</h1>
  <div class="rule"></div>
  <div class="subtitle">
    یک چرخش؛ یک سرنوشت…<br>
    ببین امشب کدام جایزه نصیبت می‌شود.
  </div>
</header><section class="profile-box" aria-live="polite">
  <div class="profile-message" id="profileMessage">در حال بررسی اتصال تلگرام...</div>
  <div class="profile-chances" id="profileChances"></div>
  <div class="profile-games" id="profileGames"></div>
</section><main class="panel">
  <div class="stage" aria-label="گردونهٔ ۱۲ بخشی">
    <div class="rim">
      <svg id="wheel" viewBox="0 0 500 500" role="img" aria-label="گردونه با ۱۲ جایزه"></svg>
    </div>
    <div class="pointer" aria-hidden="true"></div>
    <div class="hub">
      <div>
        <span class="suits">♠</span>
        سام و زال
        <span class="suits">♣</span>
      </div>
    </div>
  </div>  <div class="controls">
    <button class="spin" id="spinBtn" type="button" disabled>
      🎲 در حال اتصال...
    </button>
    <div class="status" id="status" aria-live="polite">
      در حال بررسی اطلاعات راه‌اندازی تلگرام...
    </div>
    <div class="result" id="result" aria-live="polite">
      <div class="result-title" id="resultTitle"></div>
      <div class="result-desc" id="resultDesc"></div>
    </div>
  </div>
</main><p class="note">
  این گردونه رایگان و آنلاین است. نتیجهٔ چرخش از سامانهٔ گردونه دریافت و ثبت می‌شود.
</p><footer>♠ SAM O ZAL • MAFIA NIGHT ♣</footer></div><script>
(function(){
'use strict';

// ==========================================
// تنظیمات و فهرست جوایز
// ==========================================

const prizes=[
  {code:'P1',label:['VPN','۴ گیگ']},
  {code:'P2',label:['شارژ','۱۰ هزار']},
  {code:'P3',label:['VPN','۲ گیگ']},
  {code:'P4',label:['شارژ','۵ هزار']},
  {code:'P5',label:['VPN','۱ گیگ']},
  {code:'P6',label:['شارژ ویژه','۱۰۰ هزار']},
  {code:'P7',label:['اینترنت','۱ ماهه']},
  {code:'P8',label:['حاکم','سناریو']},
  {code:'P9',label:['شانس','اضافی']},
  {code:'P10',label:['شارژ','۲۰ هزار']},
  {code:'P11',label:['شارژ','۵۰ هزار']},
  {code:'P12',label:['شارژ','۸۰ هزار']}
];

// ==========================================
// عناصر صفحه
// ==========================================

const svg=document.getElementById('wheel');
const profileMessage=document.getElementById('profileMessage');
const profileChances=document.getElementById('profileChances');
const profileGames=document.getElementById('profileGames');
const status=document.getElementById('status');
const spinBtn=document.getElementById('spinBtn');
const result=document.getElementById('result');
const resultTitle=document.getElementById('resultTitle');
const resultDesc=document.getElementById('resultDesc');

const tg=window.Telegram && window.Telegram.WebApp;
const params=new URLSearchParams(window.location.search);

const profileApiUrl=params.get('api');
const spinApiUrl=params.get('spinapi');

const NS='http://www.w3.org/2000/svg';

// ==========================================
// وضعیت برنامه
// ==========================================

let spinning=false;
let currentRotation=0;
let profileLoaded=false;
let remainingChances=0;

// ==========================================
// ابزارهای SVG
// ==========================================

function el(tag,attrs={},text){
  const node=document.createElementNS(NS,tag);

  Object.entries(attrs).forEach(([key,value])=>{
    node.setAttribute(key,value);
  });

  if(text!==undefined) node.textContent=text;

  return node;
}

function point(radius,angle){
  const radians=(angle-90)*Math.PI/180;

  return [
    250+radius*Math.cos(radians),
    250+radius*Math.sin(radians)
  ];
}

// ==========================================
// ساخت گردونه
// ==========================================

function buildWheel(){

  if(!svg) throw new Error('عنصر گردونه پیدا نشد.');

  svg.innerHTML='';

  const group=el('g',{id:'slices'});

  const colors=[
    '#8f1422','#17171d','#b02230','#242027',
    '#74131e','#19191f','#a51e2a','#252027',
    '#821521','#17171d','#a51e2a','#252027'
  ];

  prizes.forEach((prize,index)=>{

    const start=index*30;
    const end=start+30;

    const [x1,y1]=point(239,start);
    const [x2,y2]=point(239,end);

    group.appendChild(el('path',{
      d:`M 250 250 L ${x1} ${y1} A 239 239 0 0 1 ${x2} ${y2} Z`,
      fill:colors[index],
      stroke:'#e5bd69',
      'stroke-width':'2.5'
    }));

    const middle=start+15;
    const [tx,ty]=point(154,middle);

    let textRotation=middle;

    if(middle>90&&middle<270){
      textRotation+=180;
    }

    const textGroup=el('g',{
      transform:`translate(${tx} ${ty}) rotate(${textRotation})`
    });

    const text=el('text',{
      x:0,
      y:0,
      'text-anchor':'middle',
      'dominant-baseline':'middle',
      fill:'#fff3d8',
      'font-family':'Tahoma,Arial,sans-serif',
      'font-size':21,
      'font-weight':'700',
      'paint-order':'stroke',
      stroke:'#140a0d',
      'stroke-width':'2.6',
      'stroke-linejoin':'round'
    });

    prize.label.forEach((line,lineIndex)=>{
      text.appendChild(el('tspan',{
        x:0,
        dy:lineIndex===0?'-0.52em':'1.15em'
      },line));
    });

    textGroup.appendChild(text);
    group.appendChild(textGroup);
  });

  svg.appendChild(group);

  svg.appendChild(el('circle',{
    cx:250,cy:250,r:244,
    fill:'none',
    stroke:'#f0ce7a',
    'stroke-width':'4'
  }));

  svg.appendChild(el('circle',{
    cx:250,cy:250,r:88,
    fill:'none',
    stroke:'#e8c46f',
    'stroke-width':'2',
    'stroke-opacity':'.7'
  }));

  svg.style.transformOrigin='50% 50%';
}

// ==========================================
// پردازش پاسخ سرور
// ==========================================

async function readApiResponse(response){

  const text=await response.text();

  let data;

  try{
    data=JSON.parse(text);
  }catch(error){
    throw new Error('پاسخ سرور JSON معتبر نیست.');
  }

  if(!response.ok){
    throw new Error(
      data.message || 'خطای سرور: '+response.status
    );
  }

  return data;
}

// ==========================================
// نمایش پروفایل
// ==========================================

function updateProfileDisplay(data){

  remainingChances=Number(data.chances);

  if(!Number.isFinite(remainingChances)){
    remainingChances=0;
  }

  const games=Number(data.samozal_games)||0;

  profileMessage.textContent='✅ اطلاعات حساب دریافت شد.';
  profileChances.textContent='🎟️ شانس باقی‌مانده: '+remainingChances;
  profileGames.textContent='🎮 تعداد بازی‌ها: '+games;

  profileLoaded=true;

  if(remainingChances>0){

    spinBtn.disabled=false;
    spinBtn.style.opacity='1';
    spinBtn.textContent='🎲 چرخاندن گردونه';

    status.textContent='برای دریافت جایزه، گردونه را بچرخان.';

  }else{

    spinBtn.disabled=true;
    spinBtn.style.opacity='.7';
    spinBtn.textContent='🎲 شانس کافی ندارید';

    status.textContent='در حال حاضر شانس فعالی برای چرخش ندارید.';
  }
}

// ==========================================
// دریافت اطلاعات حساب از wp
// ==========================================

async function loadProfile(){

  spinBtn.disabled=true;
  spinBtn.style.opacity='.7';

  if(!tg){
    profileMessage.textContent='❌ محیط تلگرام شناسایی نشد.';
    status.textContent='لطفاً صفحه را از داخل تلگرام باز کن.';
    return;
  }

  tg.ready();

  if(!tg.initData){
    profileMessage.textContent='❌ اطلاعات راه‌اندازی تلگرام دریافت نشد.';
    status.textContent='صفحه باید به‌عنوان Mini App باز شود.';
    return;
  }

  if(!profileApiUrl){
    profileMessage.textContent='❌ لینک دریافت پروفایل وجود ندارد.';
    status.textContent='لینک اختصاصی گردونه ناقص است.';
    return;
  }

  profileMessage.textContent='در حال دریافت اطلاعات حساب...';

  try{

    const response=await fetch(profileApiUrl,{
      method:'GET',
      cache:'no-store'
    });

    const data=await readApiResponse(response);

    if(data.ok!==true){
      throw new Error(data.message||'دریافت پروفایل ناموفق بود.');
    }

    if(data.profile_found!==true){
      profileMessage.textContent='⚠️ پروفایل شما در سیستم پیدا نشد.';
      status.textContent='ابتدا باید پروفایل شما ثبت شده باشد.';
      return;
    }

    const telegramUser=tg.initDataUnsafe && tg.initDataUnsafe.user;

    if(
      telegramUser &&
      Number(data.user_id)!==Number(telegramUser.id)
    ){
      throw new Error('شناسه کاربر با پروفایل دریافتی مطابقت ندارد.');
    }

    updateProfileDisplay(data);

  }catch(error){

    profileLoaded=false;

    profileMessage.textContent='❌ دریافت اطلاعات حساب ناموفق بود.';
    status.textContent=error.message||'خطای ارتباط با سرور.';

    console.error('Profile API error:',error);
  }
}

// ==========================================
// انیمیشن گردونه
// ==========================================

function animateToPrize(prizeCode){

  return new Promise((resolve,reject)=>{

    const index=prizes.findIndex(prize=>prize.code===prizeCode);

    if(index===-1){
      reject(new Error('کد جایزه در گردونه پیدا نشد.'));
      return;
    }

    const prizeCenter=index*30+15;
    const targetAngle=(360-prizeCenter+360)%360;
    const currentAngle=((currentRotation%360)+360)%360;
    const adjustment=(targetAngle-currentAngle+360)%360;

    currentRotation+=6*360+adjustment;

    svg.style.transition='transform 6s cubic-bezier(0.12,0.75,0.12,1)';

    let finished=false;

    function finish(){
      if(finished) return;

      finished=true;

      svg.removeEventListener('transitionend',onTransitionEnd);
      resolve();
    }

    function onTransitionEnd(event){
      if(event.target===svg) finish();
    }

    svg.addEventListener('transitionend',onTransitionEnd);

    svg.style.transform='rotate('+currentRotation+'deg)';

    setTimeout(finish,7000);
  });
}

// ==========================================
// چرخش واقعی گردونه
// ==========================================

async function spinWheel(){

  if(spinning) return;

  if(!profileLoaded){
    status.textContent='ابتدا باید اطلاعات پروفایل دریافت شود.';
    return;
  }

  if(remainingChances<=0){
    status.textContent='❌ شانس کافی برای چرخش ندارید.';
    return;
  }

  if(!spinApiUrl){
    status.textContent='❌ لینک چرخش گردونه موجود نیست.';
    return;
  }

  spinning=true;
  spinBtn.disabled=true;
  spinBtn.textContent='⏳ در حال چرخش...';

  result.classList.remove('show');

  status.textContent='در حال ثبت چرخش و دریافت جایزه...';

  try{

    const response=await fetch(spinApiUrl,{
      method:'GET',
      cache:'no-store'
    });

    const data=await readApiResponse(response);

    if(data.ok!==true){
      throw new Error(data.message||'چرخش گردونه ناموفق بود.');
    }

    if(!data.prize||!data.prize.code){
      throw new Error('اطلاعات جایزه از سرور دریافت نشد.');
    }

    const selectedPrize=prizes.find(
      prize=>prize.code===data.prize.code
    );

    if(!selectedPrize){
      throw new Error('کد جایزهٔ دریافتی معتبر نیست.');
    }

    await animateToPrize(selectedPrize.code);

    resultTitle.textContent='🎉 '+data.prize.name;
    resultDesc.textContent='جایزه با موفقیت در سیستم ثبت شد.';
    result.classList.add('show');

    status.textContent='چرخش با موفقیت انجام شد.';

    remainingChances=Number(data.chances);

    if(!Number.isFinite(remainingChances)){
      remainingChances=0;
    }

    profileChances.textContent='🎟️ شانس باقی‌مانده: '+remainingChances;

    if(data.samozal_games!==undefined){
      profileGames.textContent=
        '🎮 تعداد بازی‌ها: '+(Number(data.samozal_games)||0);
    }

    profileMessage.textContent='✅ جایزه با موفقیت ثبت شد.';

    if(tg&&tg.HapticFeedback){
      tg.HapticFeedback.notificationOccurred('success');
    }

    if(remainingChances>0){
      spinBtn.textContent='🎲 چرخاندن دوباره';
    }else{
      spinBtn.textContent='🎲 شانس شما تمام شد';
    }

  }catch(error){

    status.textContent='❌ '+(
      error.message||'خطا در اجرای چرخش گردونه.'
    );

    console.error('Spin API error:',error);

    await loadProfile();

  }finally{

    spinning=false;

    if(profileLoaded&&remainingChances>0){

      spinBtn.disabled=false;
      spinBtn.style.opacity='1';

      if(spinBtn.textContent!=='🎲 چرخاندن دوباره'){
        spinBtn.textContent='🎲 چرخاندن گردونه';
      }

    }else{

      spinBtn.disabled=true;
      spinBtn.style.opacity='.7';
    }
  }
}

// ==========================================
// شروع برنامه
// ==========================================

try{

  buildWheel();

  spinBtn.addEventListener('click',spinWheel);

  if(tg){
    tg.ready();
    tg.expand();
  }

  loadProfile();

}catch(error){

  console.error('Mini App startup error:',error);

  profileMessage.textContent='❌ خطا در راه‌اندازی صفحه.';
  status.textContent=error.message||'خطای داخلی صفحه.';
  spinBtn.disabled=true;
}

})();
</script></body>
</html>
