<script>

  {code:'P11',label:['شارژ','۵۰ هزار']},

];

// ==========================================
// عناصر صفحه
// ==========================================

const svg=document.getElementById('wheel');

const profileMessage=document.getElementById('profileMessage');
const profileChances=document.getElementById('profileChances');
const profileGames=document.getElementById('profileGames');

const status=document.getElementById('status');
const recordingStatus=document.getElementById('recordingStatus');

const spinBtn=document.getElementById('spinBtn');

const result=document.getElementById('result');
const resultTitle=document.getElementById('resultTitle');
const resultDesc=document.getElementById('resultDesc');

// ==========================================
// تنظیمات API و تلگرام
// ==========================================

let tg=null;

const params=new URLSearchParams(window.location.search);

const profileApiUrl=params.get('api');
const spinApiUrl=params.get('spinapi');
const videoApiUrl=params.get('videoapi');

const NS='http://www.w3.org/2000/svg';

const PROFILE_TIMEOUT=15000;
const SPIN_TIMEOUT=20000;
const UPLOAD_TIMEOUT=120000;
const WEBHOOK_TIMEOUT=30000;

// ==========================================
// وضعیت برنامه
// ==========================================

let spinning=false;
let currentRotation=0;
let profileLoaded=false;
let remainingChances=0;

// ==========================================
// وضعیت افکت برنده
// ==========================================

let winnerEffect=null;
let winnerEffectFrame=null;
let winnerEffectGroup=null;

const WINNER_EFFECT_DURATION=2300;

// ==========================================
// وضعیت نشست‌های ضبط
// ==========================================

// هر چرخش یک recordingSession مستقل دارد.
// اطلاعات ضبط قبلی در نشست خودش باقی می‌ماند.
// شروع ضبط جدید به اطلاعات نشست قبلی دست نمی‌زند.

let activeRecordingSession=null;

// ==========================================
// گزارش خطا
// ==========================================

function recordingLog(stage,message,error){
  console.log(
    '[SAMOZAL RECORD]['+stage+']',
    message,
    error||''
  );
}

// فقط ایموجی وضعیت به کاربر نشان داده می‌شود.
// جزئیات فنی و خطاها فقط در Console ثبت می‌شوند.

function setRecordingMessage(message,type,session){

  // نتیجه یک نشست قدیمی نباید وضعیت نشست جدید را تغییر دهد.
  if(session&&activeRecordingSession!==session){
    return;
  }

  if(type==='error'){
    recordingStatus.textContent='⚠️';
  }else if(type==='success'){
    recordingStatus.textContent='✨';
  }else if(message){
    recordingStatus.textContent='⏳';
  }else{
    recordingStatus.textContent='';
  }

  recordingStatus.style.color='#f0ce7a';
}

// ==========================================
// درخواست شبکه با محدودیت زمانی
// ==========================================

async function fetchWithTimeout(url,options,timeout,message){

  const controller=new AbortController();

  const timer=setTimeout(function(){
    controller.abort();
  },timeout);

  try{

    const requestOptions=Object.assign({},options||{},{
      signal:controller.signal
    });

    return await fetch(url,requestOptions);

  }catch(error){

    if(error&&error.name==='AbortError'){
      throw new Error(message||'زمان انتظار پاسخ سرور به پایان رسید.');
    }

    throw error;

  }finally{

    clearTimeout(timer);
  }
}

// ==========================================
// مدیریت افکت برنده در SVG
// ==========================================

function clearWinnerEffect(){

  winnerEffect=null;

  if(winnerEffectFrame){
    cancelAnimationFrame(winnerEffectFrame);
    winnerEffectFrame=null;
  }

  if(winnerEffectGroup){
    winnerEffectGroup.remove();
    winnerEffectGroup=null;
  }
}

function createWinnerEffect(index){

  clearWinnerEffect();

  const start=index*30;
  const end=start+30;
  const middle=start+15;

  const [x1,y1]=point(239,start);
  const [x2,y2]=point(239,end);
  const [tx,ty]=point(154,middle);

  winnerEffect={
    index:index,
    startTime:performance.now()
  };

  winnerEffectGroup=el('g',{
    id:'winnerEffect',
    'pointer-events':'none'
  });

  winnerEffectGroup.appendChild(el('path',{
    d:`M 250 250 L ${x1} ${y1} A 239 239 0 0 1 ${x2} ${y2} Z`,
    fill:'#ffd76a',
    'fill-opacity':'.28',
    stroke:'#fff0ad',
    'stroke-width':'5',
    filter:'url(#winnerGlow)'
  }));

  const defs=el('defs');

  const filter=el('filter',{
    id:'winnerGlow',
    x:'-80%',
    y:'-80%',
    width:'260%',
    height:'260%'
  });

  filter.appendChild(el('feGaussianBlur',{
    stdDeviation:'5',
    result:'blur'
  }));

  const merge=el('feMerge');
  merge.appendChild(el('feMergeNode',{in:'blur'}));
  merge.appendChild(el('feMergeNode',{in:'SourceGraphic'}));
  filter.appendChild(merge);
  defs.appendChild(filter);
  winnerEffectGroup.appendChild(defs);

  for(let i=0;i<3;i++){

    winnerEffectGroup.appendChild(el('circle',{
      class:'winner-pulse',
      cx:tx,
      cy:ty,
      r:18,
      fill:'none',
      stroke:i===1?'#fff4bd':'#ffd45c',
      'stroke-width':i===1?'3':'2',
      'stroke-opacity':'.95',
      'data-pulse':i
    }));

  }

  for(let i=0;i<16;i++){

    const angle=(Math.PI*2*i)/16;
    const distance=25+(i%3)*7;

    const sx=tx+Math.cos(angle)*distance;
    const sy=ty+Math.sin(angle)*distance;

    winnerEffectGroup.appendChild(el('path',{
      class:'winner-particle',
      d:'M 0 -7 L 4 0 L 0 7 L -4 0 Z',
      fill:i%2===0?'#fff2b0':'#ffca4c',
      transform:`translate(${sx} ${sy}) scale(.8)`,
      'data-angle':angle,
      'data-x':tx,
      'data-y':ty,
      'data-distance':distance
    }));

  }

  const originalLabel=svg.querySelector(
    `[data-label-index="${index}"]`
  );

  if(originalLabel){

    const highlightedLabel=originalLabel.cloneNode(true);

    highlightedLabel.setAttribute('class','winner-label');

    const originalTransform=originalLabel.getAttribute('transform');

    highlightedLabel.setAttribute(
      'data-base-transform',
      originalTransform
    );

    highlightedLabel.querySelectorAll('text').forEach(text=>{

      text.setAttribute('fill','#fff8d7');
      text.setAttribute('stroke','#8b4d0b');
      text.setAttribute('stroke-width','4');
      text.setAttribute('filter','url(#winnerGlow)');

    });

    winnerEffectGroup.appendChild(highlightedLabel);
  }

  svg.appendChild(winnerEffectGroup);

  updateWinnerEffectVisual(0);
  runWinnerEffectAnimation();
}

function updateWinnerEffectVisual(progress){

  if(!winnerEffectGroup||!winnerEffect) return;

  const t=Math.max(0,Math.min(1,progress));

  const pulseNodes=winnerEffectGroup.querySelectorAll('.winner-pulse');

  pulseNodes.forEach((node,index)=>{

    const phase=(t*2.5+index/3)%1;
    const radius=18+phase*75;

    node.setAttribute('r',radius);
    node.setAttribute('stroke-opacity',Math.max(.05,1-phase));
    node.setAttribute('stroke-width',Math.max(1,4-phase*3));
  });

  const particles=winnerEffectGroup.querySelectorAll('.winner-particle');

  particles.forEach(node=>{

    const angle=Number(node.getAttribute('data-angle'));
    const cx=Number(node.getAttribute('data-x'));
    const cy=Number(node.getAttribute('data-y'));
    const distance=Number(node.getAttribute('data-distance'));

    const travel=distance+(t*65);
    const x=cx+Math.cos(angle)*travel;
    const y=cy+Math.sin(angle)*travel;

    const scale=Math.max(.05,1-t*.8);

    node.setAttribute(
      'transform',
      `translate(${x} ${y}) scale(${scale}) rotate(${t*180})`
    );

    node.setAttribute(
      'opacity',
      Math.max(.08,1-t*.75)
    );
  });

  const label=winnerEffectGroup.querySelector('.winner-label');

  if(label){

    const scale=1+Math.sin(Math.min(1,t*3)*Math.PI)*.16;

    const baseTransform=label.getAttribute('data-base-transform');

    label.setAttribute(
      'transform',
      `${baseTransform} scale(${scale})`
    );

    label.style.filter='drop-shadow(0 0 8px #ffd75c)';
  }

  winnerEffectGroup.setAttribute(
    'opacity',
    t<.12 ? Math.max(.2,t/.12) : 1
  );
}

function runWinnerEffectAnimation(){

  if(!winnerEffect) return;

  const elapsed=performance.now()-winnerEffect.startTime;
  const progress=Math.min(1,elapsed/WINNER_EFFECT_DURATION);

  updateWinnerEffectVisual(progress);

  if(progress<1){

    winnerEffectFrame=requestAnimationFrame(
      runWinnerEffectAnimation
    );

  }else{

    winnerEffectFrame=null;
    updateWinnerEffectVisual(1);
  }
}

// ==========================================
// رسم افکت برنده روی Canvas فیلم
// ==========================================

function drawWinnerEffectOnCanvas(ctx){

  if(!winnerEffect) return;

  const elapsed=performance.now()-winnerEffect.startTime;

  const progress=Math.max(
    0,
    Math.min(1,elapsed/WINNER_EFFECT_DURATION)
  );

  const index=winnerEffect.index;

  const middle=(index*30+15-90)*Math.PI/180;
  const start=middle-(15*Math.PI/180);
  const end=middle+(15*Math.PI/180);

  const wheelScale=940/500;
  const labelRadius=154*wheelScale;

  const labelX=Math.cos(middle)*labelRadius;
  const labelY=Math.sin(middle)*labelRadius;

  ctx.save();

  ctx.translate(500,500);
  ctx.rotate(getWheelCurrentAngle());

  ctx.save();

  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.arc(0,0,470,start,end);
  ctx.closePath();

  ctx.fillStyle='rgba(255,211,91,0.30)';
  ctx.shadowColor='#ffe18a';
  ctx.shadowBlur=32;
  ctx.fill();

  ctx.lineWidth=8;
  ctx.strokeStyle='rgba(255,239,174,0.95)';
  ctx.stroke();

  ctx.restore();

  for(let i=0;i<3;i++){

    const phase=(progress*2.5+i/3)%1;
    const radius=(18+phase*75)*wheelScale;

    ctx.beginPath();
    ctx.arc(labelX,labelY,radius,0,Math.PI*2);

    ctx.strokeStyle=i===1
      ?`rgba(255,245,190,${Math.max(.05,1-phase)})`
      :`rgba(255,207,76,${Math.max(.05,1-phase)})`;

    ctx.lineWidth=Math.max(2,7-phase*5);
    ctx.shadowColor='#ffdb70';
    ctx.shadowBlur=18;
    ctx.stroke();
  }

  for(let i=0;i<16;i++){

    const particleAngle=(Math.PI*2*i)/16;
    const baseDistance=(25+(i%3)*7)*wheelScale;
    const travel=baseDistance+(progress*65*wheelScale);

    const x=labelX+Math.cos(particleAngle)*travel;
    const y=labelY+Math.sin(particleAngle)*travel;

    const alpha=Math.max(.08,1-progress*.75);
    const size=5*(1-progress*.8);

    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(progress*Math.PI);

    ctx.globalAlpha=alpha;
    ctx.fillStyle=i%2===0?'#fff2b0':'#ffca4c';
    ctx.shadowColor='#ffd75c';
    ctx.shadowBlur=16;

    ctx.beginPath();
    ctx.moveTo(0,-size);
    ctx.lineTo(size*.55,0);
    ctx.lineTo(0,size);
    ctx.lineTo(-size*.55,0);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  const scale=1+Math.sin(Math.min(1,progress*3)*Math.PI)*.16;

  ctx.save();
  ctx.translate(labelX,labelY);
  ctx.scale(scale,scale);

  ctx.shadowColor='#fff0a0';
  ctx.shadowBlur=24;
  ctx.strokeStyle='#fff0b5';
  ctx.lineWidth=5;
  ctx.beginPath();
  ctx.arc(0,0,31*wheelScale,0,Math.PI*2);
  ctx.stroke();

  ctx.restore();

  ctx.restore();
}

// ==========================================
// آپلود خودکار فیلم به EasySend
// ==========================================

async function uploadWheelVideo(blob){

  if(!blob||!blob.size){
    throw new Error('فایل ضبط‌شده خالی است.');
  }

  const uploadEndpoint='https://easysend.co/api/v1/upload';

  const isMp4=(blob.type||'').toLowerCase().includes('mp4');
  const isWebm=(blob.type||'').toLowerCase().includes('webm');

  if(!isMp4&&!isWebm){
    throw new Error('فرمت واقعی فایل ضبط‌شده قابل تشخیص نیست.');
  }

  const fileExtension=isMp4?'mp4':'webm';
  const fileMime=isMp4?'video/mp4':'video/webm';

  recordingLog(
    'UPLOAD START',
    'شروع آپلود فایل از Mini App.',
    {
      size:blob.size,
      type:blob.type,
      extension:fileExtension
    }
  );

  const formData=new FormData();

  const fileName='samozal-wheel-'+Date.now()+'.'+fileExtension;

  const videoFile=new File(
    [blob],
    fileName,
    {type:fileMime}
  );

  formData.append('files[]',videoFile);

  let response;

  try{

    response=await fetchWithTimeout(
      uploadEndpoint,
      {
        method:'POST',
        body:formData
      },
      UPLOAD_TIMEOUT,
      'زمان آپلود ویدئو به پایان رسید.'
    );

  }catch(error){

    recordingLog(
      'UPLOAD NETWORK ERROR',
      'ارتباط با EasySend برقرار نشد یا زمان آپلود به پایان رسید.',
      error
    );

    throw new Error(
      error.message||'ارتباط با EasySend برقرار نشد.'
    );
  }

  const responseText=await response.text();

  let data;

  try{

    data=JSON.parse(responseText);

  }catch(error){

    recordingLog(
      'UPLOAD JSON ERROR',
      'پاسخ EasySend قابل تبدیل به JSON نیست.',
      responseText
    );

    throw new Error('پاسخ سرور EasySend معتبر نیست.');
  }

  if(!response.ok){

    recordingLog(
      'UPLOAD HTTP ERROR',
      'خطای HTTP از EasySend.',
      {
        status:response.status,
        data:data
      }
    );

    throw new Error(
      data.message||
      data.error||
      'خطای سرور EasySend: '+response.status
    );
  }

  if(data.success!==true){

    recordingLog(
      'UPLOAD FAILED',
      'سرور آپلود را موفق اعلام نکرد.',
      data
    );

    throw new Error(
      data.message||
      data.error||
      'آپلود فایل در EasySend ناموفق بود.'
    );
  }

  if(
    !data.files||
    !Array.isArray(data.files)||
    !data.files[0]||
    !data.files[0].download_url
  ){

    recordingLog(
      'UPLOAD RESPONSE ERROR',
      'لینک مستقیم در پاسخ سرور پیدا نشد.',
      data
    );

    throw new Error(
      'آپلود انجام شد اما لینک مستقیم فایل در پاسخ وجود ندارد.'
    );
  }

  let downloadUrl;
  let shareLink='';

  try{

    const parsedDownloadUrl=new URL(
      data.files[0].download_url,
      'https://easysend.co'
    );

    if(
      parsedDownloadUrl.protocol!=='https:'||
      parsedDownloadUrl.hostname!=='easysend.co'
    ){
      throw new Error('دامنه لینک دانلود مورد تأیید نیست.');
    }

    downloadUrl=parsedDownloadUrl.href;

    if(data.share_link){

      const parsedShareLink=new URL(
        data.share_link,
        'https://easysend.co'
      );

      if(
        parsedShareLink.protocol!=='https:'||
        parsedShareLink.hostname!=='easysend.co'
      ){
        throw new Error('دامنه لینک اشتراک‌گذاری مورد تأیید نیست.');
      }

      shareLink=parsedShareLink.href;
    }

  }catch(error){

    recordingLog(
      'UPLOAD URL ERROR',
      'لینک برگشتی از EasySend معتبر نیست.',
      error
    );

    throw new Error(
      error.message||'لینک برگشتی از EasySend معتبر نیست.'
    );
  }

  recordingLog(
    'UPLOAD SUCCESS',
    'آپلود و دریافت لینک مستقیم موفق بود.',
    {
      downloadUrl:downloadUrl,
      shareLink:shareLink,
      fileName:data.files[0].name,
      fileSize:data.files[0].size
    }
  );

  return {
    downloadUrl:downloadUrl,
    shareLink:shareLink,
    fileName:data.files[0].name||fileName,
    fileSize:data.files[0].size||blob.size,
    expiresAt:data.expires_at||null
  };
}

// ارسال لینک مستقیم به فرمان wheelvideo

async function sendVideoLinkToBot(downloadUrl){

  if(!videoApiUrl){
    throw new Error('لینک اختصاصی videoapi در صفحه وجود ندارد.');
  }

  if(!downloadUrl||typeof downloadUrl!=='string'){
    throw new Error('لینک مستقیم فیلم معتبر نیست.');
  }

  const parsedUrl=new URL(downloadUrl);

  if(
    parsedUrl.protocol!=='https:'||
    parsedUrl.hostname!=='easysend.co'
  ){
    throw new Error('دامنه لینک فیلم مورد تأیید نیست.');
  }

  recordingLog(
    'VIDEO WEBHOOK START',
    'ارسال لینک فیلم به TelebotHost آغاز شد.'
  );

  let response;

  try{

    response=await fetchWithTimeout(
      videoApiUrl,
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          downloadUrl:downloadUrl
        }),
        cache:'no-store'
      },
      WEBHOOK_TIMEOUT,
      'زمان انتظار پاسخ فرمان ارسال ویدئو به پایان رسید.'
    );

  }catch(error){

    recordingLog(
      'VIDEO WEBHOOK NETWORK ERROR',
      'ارتباط با فرمان wheelvideo برقرار نشد.',
      error
    );

    throw new Error(
      error.message||'ارسال لینک به TelebotHost ناموفق بود.'
    );
  }

  const data=await readApiResponse(response);

  if(data.ok!==true||data.received!==true){

    throw new Error(
      data.message||'TelebotHost دریافت لینک را تأیید نکرد.'
    );
  }

  recordingLog(
    'VIDEO WEBHOOK SUCCESS',
    'فرمان wheelvideo دریافت لینک را تأیید کرد.'
  );

  return data;
}

// ==========================================
// دریافت زاویه واقعی گردونه
// ==========================================

function getWheelCurrentAngle(){

  const transform=getComputedStyle(svg).transform;

  if(!transform||transform==='none'){
    return 0;
  }

  try{

    let matrix;

    if(typeof DOMMatrixReadOnly!=='undefined'){

      matrix=new DOMMatrixReadOnly(transform);

    }else if(typeof DOMMatrix!=='undefined'){

      matrix=new DOMMatrix(transform);

    }else{

      const match=transform.match(/matrix\(([^)]+)\)/);

      if(!match){
        throw new Error('ماتریس چرخش قابل خواندن نیست.');
      }

      const parts=match[1].split(',').map(Number);

      return Math.atan2(parts[1],parts[0]);
    }

    return Math.atan2(matrix.b,matrix.a);

  }catch(error){

    recordingLog(
      'ANGLE ERROR',
      'خواندن زاویه ناموفق بود.',
      error
    );

    throw error;
  }
}

// ==========================================
// آماده‌سازی تصویر SVG برای یک نشست ضبط
// ==========================================

async function prepareWheelRecordingImage(session){

  if(!svg){
    throw new Error('عنصر SVG گردونه پیدا نشد.');
  }

  if(!svg.querySelector('path')){
    throw new Error('قسمت‌های گردونه هنوز ساخته نشده‌اند.');
  }

  const svgClone=svg.cloneNode(true);

  svgClone.setAttribute('xmlns',NS);
  svgClone.setAttribute('width','500');
  svgClone.setAttribute('height','500');

  svgClone.removeAttribute('style');

  const cloneEffect=svgClone.querySelector('#winnerEffect');

  if(cloneEffect){
    cloneEffect.remove();
  }

  const svgText=new XMLSerializer().serializeToString(svgClone);

  const svgBlob=new Blob(
    [svgText],
    {type:'image/svg+xml;charset=utf-8'}
  );

  session.svgUrl=URL.createObjectURL(svgBlob);

  session.svgImage=new Image();

  await new Promise((resolve,reject)=>{

    session.svgImage.onload=resolve;

    session.svgImage.onerror=function(){
      reject(new Error('بارگذاری تصویر SVG گردونه ناموفق بود.'));
    };

    session.svgImage.src=session.svgUrl;
  });

  if(
    !session.svgImage.naturalWidth||
    !session.svgImage.naturalHeight
  ){
    throw new Error('ابعاد تصویر SVG معتبر نیست.');
  }

  recordingLog(
    'IMAGE READY',
    'تصویر اصلی گردونه برای نشست ضبط آماده شد.',
    session.id
  );
}

// ==========================================
// رسم قاب طلایی و گردونه روی Canvas نشست
// ==========================================

function drawWheelRecordingFrame(session){

  if(!session||!session.canvasContext||!session.svgImage){
    throw new Error('Canvas یا تصویر گردونه آماده نیست.');
  }

  const ctx=session.canvasContext;
  const angle=getWheelCurrentAngle();

  ctx.clearRect(0,0,1000,1000);

  ctx.fillStyle='#09090d';
  ctx.fillRect(0,0,1000,1000);

  const rimGradient=ctx.createLinearGradient(
    100,100,900,900
  );

  rimGradient.addColorStop(0,'#fff0b5');
  rimGradient.addColorStop(.25,'#8c622b');
  rimGradient.addColorStop(.45,'#f6d98d');
  rimGradient.addColorStop(.68,'#68451f');
  rimGradient.addColorStop(1,'#e8c46f');

  ctx.beginPath();
  ctx.arc(500,500,490,0,Math.PI*2);
  ctx.fillStyle=rimGradient;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(500,500,472,0,Math.PI*2);
  ctx.fillStyle='#171015';
  ctx.fill();

  ctx.save();

  ctx.translate(500,500);
  ctx.rotate(angle);

  ctx.drawImage(
    session.svgImage,
    -470,
    -470,
    940,
    940
  );

  ctx.restore();

  drawWinnerEffectOnCanvas(ctx);

  ctx.save();

  ctx.beginPath();
  ctx.moveTo(500,22);
  ctx.lineTo(464,82);
  ctx.lineTo(536,82);
  ctx.closePath();

  const pointerGradient=ctx.createLinearGradient(464,22,536,82);

  pointerGradient.addColorStop(0,'#fff0b5');
  pointerGradient.addColorStop(1,'#d6a64f');

  ctx.fillStyle=pointerGradient;
  ctx.fill();

  ctx.lineWidth=4;
  ctx.strokeStyle='#68451f';
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(500,43);
  ctx.lineTo(482,76);
  ctx.lineTo(518,76);
  ctx.closePath();

  ctx.fillStyle='#921524';
  ctx.fill();

  ctx.restore();

  const hubGradient=ctx.createRadialGradient(
    465,455,10,
    500,500,100
  );

  hubGradient.addColorStop(0,'#432226');
  hubGradient.addColorStop(1,'#100d12');

  ctx.beginPath();
  ctx.arc(500,500,92,0,Math.PI*2);
  ctx.fillStyle=hubGradient;
  ctx.fill();

  ctx.lineWidth=9;
  ctx.strokeStyle='#e6c16e';
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(500,500,101,0,Math.PI*2);
  ctx.lineWidth=5;
  ctx.strokeStyle='#a67b37';
  ctx.stroke();

  ctx.textAlign='center';
  ctx.textBaseline='middle';

  ctx.fillStyle='#f0ce7a';
  ctx.font='bold 31px Tahoma,Arial,sans-serif';
  ctx.fillText('♠',500,458);

  ctx.font='bold 25px Tahoma,Arial,sans-serif';
  ctx.fillText('سام و زال',500,500);

  ctx.font='bold 31px Tahoma,Arial,sans-serif';
  ctx.fillText('♣',500,542);
}

// ==========================================
// حلقه رسم فریم‌های یک نشست
// ==========================================

function recordingFrameLoop(session){

  if(!session||!session.active) return;

  try{

    drawWheelRecordingFrame(session);

    session.animationFrame=requestAnimationFrame(
      function(){
        recordingFrameLoop(session);
      }
    );

  }catch(error){

    recordingLog(
      'FRAME ERROR',
      'خطا در رسم فریم.',
      {
        sessionId:session.id,
        error:error
      }
    );

    session.active=false;

    if(session.animationFrame){
      cancelAnimationFrame(session.animationFrame);
      session.animationFrame=null;
    }

    setRecordingMessage('', 'error',session);

    // فقط همین نشست متوقف می‌شود.
    // نشست‌های دیگر تحت تأثیر قرار نمی‌گیرند.

    if(
      session.recorder&&
      session.recorder.state==='recording'
    ){
      try{
        session.recorder.stop();
      }catch(stopError){
        recordingLog(
          'FRAME STOP ERROR',
          'توقف ضبط پس از خطای فریم ناموفق بود.',
          stopError
        );
      }
    }
  }
}

// ==========================================
// انتخاب فرمت ضبط
// اولویت با MP4/H.264 و سپس WebM
// ==========================================

function getSupportedVideoMimeType(){

  if(typeof MediaRecorder==='undefined'){
    throw new Error('MediaRecorder در این مرورگر موجود نیست.');
  }

  if(typeof MediaRecorder.isTypeSupported!=='function'){
    return '';
  }

  const formats=[
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4;codecs=avc1.42E01E',
    'video/mp4',
    'video/webm;codecs=vp8',
    'video/webm',
    'video/webm;codecs=vp9'
  ];

  for(const format of formats){

    try{

      if(MediaRecorder.isTypeSupported(format)){

        recordingLog(
          'FORMAT SELECTED',
          'فرمت قابل پشتیبانی انتخاب شد.',
          format
        );

        return format;
      }

    }catch(error){

      recordingLog(
        'FORMAT CHECK',
        'بررسی فرمت ناموفق بود.',
        {
          format:format,
          error:error
        }
      );
    }
  }

  // مرورگر در صورت پشتیبانی، فرمت پیش‌فرض را انتخاب می‌کند.
  return '';
}

// ==========================================
// آزادسازی منابع یک نشست ضبط
// ==========================================

function cleanupRecordingSession(session){

  if(!session) return;

  session.active=false;

  if(session.animationFrame){
    cancelAnimationFrame(session.animationFrame);
    session.animationFrame=null;
  }

  if(session.stream){

    try{
      session.stream.getTracks().forEach(track=>{
        track.stop();
      });
    }catch(error){
      recordingLog(
        'STREAM CLEANUP ERROR',
        'آزادسازی جریان ضبط ناموفق بود.',
        error
      );
    }

    session.stream=null;
  }

  if(session.svgUrl){

    try{
      URL.revokeObjectURL(session.svgUrl);
    }catch(error){
      recordingLog(
        'URL CLEANUP ERROR',
        'آزادسازی آدرس موقت تصویر ناموفق بود.',
        error
      );
    }

    session.svgUrl=null;
  }

  session.canvas=null;
  session.canvasContext=null;
  session.svgImage=null;
}

// ==========================================
// شروع ضبط مستقل برای یک چرخش
// ==========================================

async function startWheelRecording(){

  const session={
    id:Date.now()+'-'+Math.random().toString(36).slice(2),
    recorder:null,
    chunks:[],
    stream:null,
    canvas:null,
    canvasContext:null,
    svgImage:null,
    svgUrl:null,
    animationFrame:null,
    active:false,
    mimeType:'',
    blob:null,
    stopPromise:null,
    completed:false
  };

  try{

    activeRecordingSession=session;

    setRecordingMessage('⏳',null,session);

    recordingLog(
      'START',
      'آماده‌سازی نشست ضبط آغاز شد.',
      session.id
    );

    if(!window.MediaRecorder){
      throw new Error('مرورگر از MediaRecorder پشتیبانی نمی‌کند.');
    }

    if(!HTMLCanvasElement.prototype.captureStream){
      throw new Error('قابلیت Canvas Capture Stream موجود نیست.');
    }

    session.canvas=document.createElement('canvas');

    session.canvas.width=1000;
    session.canvas.height=1000;

    session.canvasContext=session.canvas.getContext('2d',{
      alpha:false
    });

    if(!session.canvasContext){
      throw new Error('ساخت Canvas ناموفق بود.');
    }

    await prepareWheelRecordingImage(session);

    drawWheelRecordingFrame(session);

    const samplePoints=[
      [500,150],
      [500,500],
      [350,350],
      [650,350]
    ];

    let canvasHasContent=false;

    for(const samplePoint of samplePoints){

      const sample=session.canvasContext.getImageData(
        samplePoint[0],
        samplePoint[1],
        1,
        1
      ).data;

      if(
        sample[0]>20||
        sample[1]>20||
        sample[2]>20
      ){
        canvasHasContent=true;
        break;
      }
    }

    if(!canvasHasContent){
      throw new Error('Canvas تصویر قابل مشاهده ندارد.');
    }

    session.stream=session.canvas.captureStream(30);

    if(!session.stream){
      throw new Error('ساخت جریان ویدئویی ناموفق بود.');
    }

    session.mimeType=getSupportedVideoMimeType();

    const options=session.mimeType
      ?{mimeType:session.mimeType}
      :undefined;

    session.recorder=new MediaRecorder(
      session.stream,
      options
    );

    // هر نشست آرایه مخصوص خودش را دارد.
    // هیچ آرایه سراسری برای جمع‌آوری داده استفاده نمی‌شود.

    session.recorder.ondataavailable=function(event){

      if(event.data&&event.data.size>0){

        session.chunks.push(event.data);

        recordingLog(
          'DATA',
          'داده دریافت شد.',
          {
            sessionId:session.id,
            size:event.data.size,
            type:event.data.type,
            totalChunks:session.chunks.length
          }
        );
      }
    };

    session.recorder.onerror=function(event){

      const error=event.error||event;

      recordingLog(
        'RECORDER ERROR',
        'خطای داخلی ضبط‌کننده.',
        {
          sessionId:session.id,
          error:error
        }
      );

      setRecordingMessage('', 'error',session);
    };

    session.recorder.onstart=function(){

      recordingLog(
        'RECORDER STARTED',
        'ضبط با فرمت واقعی آغاز شد.',
        {
          sessionId:session.id,
          mimeType:session.recorder.mimeType||
            session.mimeType||
            'فرمت پیش‌فرض مرورگر'
        }
      );
    };

    await new Promise(resolve=>{
      requestAnimationFrame(resolve);
    });

    session.recorder.start(250);

    session.active=true;

    recordingFrameLoop(session);

    setRecordingMessage('⏳',null,session);

    recordingLog(
      'READY',
      'ضبط با موفقیت شروع شد.',
      session.id
    );

    return session;

  }catch(error){

    cleanupRecordingSession(session);

    recordingLog(
      'START ERROR',
      'شروع ضبط ناموفق بود؛ چرخش بدون ضبط ادامه می‌یابد.',
      {
        sessionId:session.id,
        error:error
      }
    );

    setRecordingMessage('', 'error',session);

    if(activeRecordingSession===session){
      activeRecordingSession=null;
    }

    return null;
  }
}

// ==========================================
// توقف نشست، ساخت فایل و آپلود پس‌زمینه
// ==========================================

function stopWheelRecording(session){

  if(!session){
    return Promise.resolve(null);
  }

  // اگر توقف همین نشست قبلاً درخواست شده، همان Promise برگردانده می‌شود.
  if(session.stopPromise){
    return session.stopPromise;
  }

  session.stopPromise=new Promise(resolve=>{

    let settled=false;

    function finish(blob){

      if(settled) return;

      settled=true;

      session.completed=true;

      cleanupRecordingSession(session);

      if(activeRecordingSession===session){

        activeRecordingSession=null;

        if(blob&&blob.size>0){
          setRecordingMessage('', 'success');
        }else{
          setRecordingMessage('', 'error');
        }
      }

      resolve(blob||null);
    }

    async function processStoppedRecording(){

      try{

        // این callback فقط به اطلاعات محلی همین نشست دسترسی دارد.
        // هیچ متغیر سراسری ضبطی در این قسمت استفاده نمی‌شود.

        const recorderRef=session.recorder;
        const chunksRef=session.chunks;

        const actualMimeType=
          recorderRef.mimeType||
          (
            chunksRef[0]&&
            chunksRef[0].type
          )||
          session.mimeType||
          '';

        if(!actualMimeType){
          throw new Error('نوع واقعی فایل ضبط‌شده مشخص نیست.');
        }

        // رویداد onstop پس از آخرین dataavailable اجرا می‌شود.
        // بنابراین تمام قطعات نهایی در chunksRef قرار گرفته‌اند.

        const videoBlob=new Blob(
          chunksRef,
          {type:actualMimeType}
        );

        session.blob=videoBlob;

        if(!videoBlob||videoBlob.size===0){
          throw new Error('فایل ویدئویی خالی است.');
        }

        recordingLog(
          'COMPLETE',
          'فایل ویدئویی نشست ساخته شد.',
          {
            sessionId:session.id,
            size:videoBlob.size,
            type:videoBlob.type,
            chunks:chunksRef.length
          }
        );

        // منابع ضبط پس از ساخته‌شدن فایل آزاد می‌شوند.
        // آپلود فقط از Blob مستقل همین نشست استفاده می‌کند.

        cleanupRecordingSession(session);

        let uploadResult;

        try{

          uploadResult=await uploadWheelVideo(videoBlob);

          recordingLog(
            'UPLOAD COMPLETE',
            'لینک مستقیم آماده انتقال به مرحله بعد است.',
            {
              sessionId:session.id,
              uploadResult:uploadResult
            }
          );

        }catch(uploadError){

          recordingLog(
            'UPLOAD FINAL ERROR',
            'آپلود این نشست ناموفق بود.',
            {
              sessionId:session.id,
              error:uploadError
            }
          );

          finish(videoBlob);
          return;
        }

        // ارسال لینک به TelebotHost

        try{

          if(activeRecordingSession===session){
            setRecordingMessage('⏳',null,session);
          }

          const webhookResult=await sendVideoLinkToBot(
            uploadResult.downloadUrl
          );

          recordingLog(
            'VIDEO LINK RECEIVED',
            'TelebotHost دریافت لینک را تأیید کرد.',
            {
              sessionId:session.id,
              result:webhookResult
            }
          );

        }catch(webhookError){

          recordingLog(
            'VIDEO WEBHOOK ERROR',
            'ارسال لینک این نشست به TelebotHost ناموفق بود.',
            {
              sessionId:session.id,
              error:webhookError
            }
          );
        }

        finish(videoBlob);

      }catch(error){

        recordingLog(
          'FILE ERROR',
          'ساخت یا پردازش فایل این نشست ناموفق بود.',
          {
            sessionId:session.id,
            error:error
          }
        );

        finish(null);
      }
    }

    try{

      session.active=false;

      if(session.animationFrame){
        cancelAnimationFrame(session.animationFrame);
        session.animationFrame=null;
      }

      if(!session.recorder){

        finish(null);
        return;
      }

      if(session.recorder.state==='inactive'){

        // اگر ضبط قبلاً متوقف شده باشد، فایل موجود بررسی می‌شود.
        if(session.blob&&session.blob.size>0){
          finish(session.blob);
        }else{
          finish(null);
        }

        return;
      }

      if(activeRecordingSession===session){
        setRecordingMessage('⏳',null,session);
      }

      // رویداد onstop بعد از آخرین dataavailable اجرا می‌شود.
      session.recorder.onstop=processStoppedRecording;

      session.recorder.stop();

      recordingLog(
        'STOP',
        'درخواست توقف نشست ضبط ارسال شد.',
        session.id
      );

    }catch(error){

      recordingLog(
        'STOP ERROR',
        'توقف نشست ضبط ناموفق بود.',
        {
          sessionId:session.id,
          error:error
        }
      );

      finish(null);
    }
  });

  return session.stopPromise;
}

// ==========================================
// تشخیص تلگرام
// ==========================================

function getTelegramWebApp(){

  if(
    window.Telegram &&
    window.Telegram.WebApp
  ){
    return window.Telegram.WebApp;
  }

  return null;
}

function waitForTelegramWebApp(){

  return new Promise(resolve=>{

    const startedAt=Date.now();

    function check(){

      const webApp=getTelegramWebApp();

      if(webApp){

        tg=webApp;

        console.log('Telegram WebApp detected.');

        resolve(tg);
        return;
      }

      if(window.__telegramScriptState==='error'){
        resolve(null);
        return;
      }

      if(Date.now()-startedAt>=15000){

        console.error(
          'Telegram WebApp detection timed out.'
        );

        resolve(null);
        return;
      }

      setTimeout(check,100);
    }

    check();
  });
}

// ==========================================
// ابزارهای SVG
// ==========================================

function el(tag,attrs={},text){

  const node=document.createElementNS(NS,tag);

  Object.entries(attrs).forEach(([key,value])=>{
    node.setAttribute(key,value);
  });

  if(text!==undefined){
    node.textContent=text;
  }

  return node;
}

function point(radius,angle){

  const radians=(angle-90)*Math.PI/180;

  return [
    250+radius*Math.cos(radians),
    250+radius*Math.sin(radians)
  ];
}

// ==========================================
// ساخت گردونه
// ==========================================

function buildWheel(){

  if(!svg){
    throw new Error('عنصر گردونه پیدا نشد.');
  }

  svg.innerHTML='';

  const group=el('g',{id:'slices'});

  const colors=[
    '#8f1422','#17171d','#b02230','#242027',
    '#74131e','#19191f','#a51e2a','#252027',
    '#821521','#17171d','#a51e2a','#252027'
  ];

  prizes.forEach((prize,index)=>{

    const start=index*30;
    const end=start+30;

    const [x1,y1]=point(239,start);
    const [x2,y2]=point(239,end);

    group.appendChild(el('path',{
      d:`M 250 250 L ${x1} ${y1} A 239 239 0 0 1 ${x2} ${y2} Z`,
      fill:colors[index],
      stroke:'#e5bd69',
      'stroke-width':'2.5',
      'data-prize-index':index
    }));

    const middle=start+15;

    const [tx,ty]=point(154,middle);

    let textRotation=middle;

    if(middle>90&&middle<270){
      textRotation+=180;
    }

    const textGroup=el('g',{
      transform:`translate(${tx} ${ty}) rotate(${textRotation})`,
      'data-label-index':index
    });

    const text=el('text',{
      x:0,
      y:0,
      'text-anchor':'middle',
      'dominant-baseline':'middle',
      fill:'#fff3d8',
      'font-family':'Tahoma,Arial,sans-serif',
      'font-size':21,
      'font-weight':'700',
      'paint-order':'stroke',
      stroke:'#140a0d',
      'stroke-width':'2.6',
      'stroke-linejoin':'round'
    });

    prize.label.forEach((line,lineIndex)=>{

      text.appendChild(el('tspan',{
        x:0,
        dy:lineIndex===0?'-0.52em':'1.15em'
      },line));

    });

    textGroup.appendChild(text);
    group.appendChild(textGroup);
  });

  svg.appendChild(group);

  svg.appendChild(el('circle',{
    cx:250,
    cy:250,
    r:244,
    fill:'none',
    stroke:'#f0ce7a',
    'stroke-width':'4'
  }));

  svg.appendChild(el('circle',{
    cx:250,
    cy:250,
    r:88,
    fill:'none',
    stroke:'#e8c46f',
    'stroke-width':'2',
    'stroke-opacity':'.7'
  }));

  svg.style.transformOrigin='50% 50%';
}

// ==========================================
// خواندن پاسخ API
// ==========================================

async function readApiResponse(response){

  const text=await response.text();

  let data;

  try{

    data=JSON.parse(text);

  }catch(error){

    throw new Error('پاسخ سرور JSON معتبر نیست.');
  }

  if(!response.ok){

    throw new Error(
      data.message||'خطای سرور: '+response.status
    );
  }

  return data;
}

// ==========================================
// نمایش پروفایل
// ==========================================

function updateProfileDisplay(data){

  const chances=Number(data.chances);

  if(
    data.chances===undefined||
    data.chances===null||
    data.chances===''||
    !Number.isFinite(chances)
  ){

    profileLoaded=false;
    remainingChances=0;

    profileMessage.textContent=
      '⚠️ تعداد شانس‌های حساب قابل تشخیص نیست.';

    profileChances.textContent=
      '🎟️ شانس باقی‌مانده: نامشخص';

    spinBtn.disabled=true;
    spinBtn.style.opacity='.7';
    spinBtn.textContent='🎲 اطلاعات شانس نامشخص';

    status.textContent=
      'اطلاعات شانس از سرور معتبر نیست؛ لطفاً دوباره تلاش کنید.';

    return false;
  }

  remainingChances=chances;

  const games=Number(data.samozal_games)||0;

  profileMessage.textContent='✅ اطلاعات حساب دریافت شد.';

  profileChances.textContent=
    '🎟️ شانس باقی‌مانده: '+remainingChances;

  profileGames.textContent=
    '🎮 تعداد بازی‌ها: '+games;

  profileLoaded=true;

  if(remainingChances>0){

    spinBtn.disabled=false;
    spinBtn.style.opacity='1';
    spinBtn.textContent='🎲 چرخاندن گردونه';

    status.textContent=
      'برای دریافت جایزه، گردونه را بچرخان.';

  }else{

    spinBtn.disabled=true;
    spinBtn.style.opacity='.7';
    spinBtn.textContent='🎲 شانس کافی ندارید';

    status.textContent=
      'در حال حاضر شانس فعالی برای چرخش ندارید.';
  }

  return true;
}

// ==========================================
// دریافت پروفایل
// ==========================================

async function loadProfile(){

  spinBtn.disabled=true;
  spinBtn.style.opacity='.7';

  profileMessage.textContent=
    'در حال بررسی اتصال تلگرام...';

  status.textContent=
    'در حال بررسی بارگذاری کتابخانه تلگرام...';

  const detectedTelegram=await waitForTelegramWebApp();

  if(!detectedTelegram){

    const scriptState=window.__telegramScriptState;

    profileMessage.textContent=
      '❌ محیط تلگرام شناسایی نشد.';

    if(scriptState==='error'){

      status.textContent=
        'بارگذاری کتابخانه تلگرام از هر دو مسیر ناموفق بود.';

    }else{

      status.textContent=
        'اطلاعات Telegram.WebApp در دسترس نیست.';
    }

    console.error(
      'Telegram detection failed:',
      {
        scriptState:scriptState,
        scriptSource:window.__telegramScriptSource,
        telegramObjectExists:!!window.Telegram
      }
    );

    return;
  }

  try{

    tg.ready();

    if(typeof tg.expand==='function'){
      tg.expand();
    }

  }catch(error){

    console.error('Telegram initialization error:',error);
  }

  if(
    typeof tg.initData!=='string'||
    tg.initData.trim()===''
  ){

    profileMessage.textContent=
      '❌ اطلاعات راه‌اندازی تلگرام دریافت نشد.';

    status.textContent=
      'اطلاعات Mini App دریافت نشده است.';

    return;
  }

  if(!profileApiUrl){

    profileMessage.textContent=
      '❌ لینک دریافت پروفایل وجود ندارد.';

    status.textContent=
      'لینک اختصاصی گردونه ناقص است.';

    return;
  }

  profileMessage.textContent=
    'در حال دریافت اطلاعات حساب...';

  try{

    const response=await fetchWithTimeout(
      profileApiUrl,
      {
        method:'GET',
        cache:'no-store'
      },
      PROFILE_TIMEOUT,
      'زمان دریافت اطلاعات پروفایل به پایان رسید.'
    );

    const data=await readApiResponse(response);

    if(data.ok!==true){

      throw new Error(
        data.message||'دریافت پروفایل ناموفق بود.'
      );
    }

    if(data.profile_found!==true){

      profileMessage.textContent=
        '⚠️ پروفایل شما در سیستم پیدا نشد.';

      status.textContent=
        'ابتدا باید پروفایل شما ثبت شده باشد.';

      return;
    }

    const telegramUser=
      tg.initDataUnsafe&&tg.initDataUnsafe.user;

    if(
      telegramUser&&
      Number(data.user_id)!==Number(telegramUser.id)
    ){

      throw new Error(
        'شناسه کاربر با پروفایل دریافتی مطابقت ندارد.'
      );
    }

    updateProfileDisplay(data);

  }catch(error){

    profileLoaded=false;

    profileMessage.textContent=
      '❌ دریافت اطلاعات حساب ناموفق بود.';

    status.textContent=
      error.message||'خطای ارتباط با سرور.';

    console.error('Profile API error:',error);
  }
}

// ==========================================
// انیمیشن گردونه و نمایش افکت برنده
// ==========================================

function animateToPrize(prizeCode){

  return new Promise(async (resolve,reject)=>{

    const index=prizes.findIndex(
      prize=>prize.code===prizeCode
    );

    if(index===-1){

      reject(
        new Error('کد جایزه در گردونه پیدا نشد.')
      );

      return;
    }

    const prizeCenter=index*30+15;

    const targetAngle=
      (360-prizeCenter+360)%360;

    const currentAngle=
      ((currentRotation%360)+360)%360;

    const adjustment=
      (targetAngle-currentAngle+360)%360;

    // نشست مخصوص همین چرخش ساخته می‌شود.
    // در صورت شکست ضبط، چرخش همچنان ادامه پیدا می‌کند.

    const recordingSession=
      await startWheelRecording();

    if(!recordingSession){

      recordingLog(
        'ANIMATION CONTINUES',
        'ضبط آغاز نشد؛ چرخش بدون ضبط ادامه می‌یابد.'
      );
    }

    currentRotation+=6*360+adjustment;

    svg.style.transition=
      'transform 6s cubic-bezier(0.12,0.75,0.12,1)';

    let finished=false;
    let fallbackTimer=null;

    async function finish(){

      if(finished) return;

      finished=true;

      svg.removeEventListener(
        'transitionend',
        onTransitionEnd
      );

      if(fallbackTimer){
        clearTimeout(fallbackTimer);
      }

      status.textContent=
        'لطفاً تا پایان این مرحله، گردونه را باز نگه دارید.';

      createWinnerEffect(index);

      recordingLog(
        'WINNER EFFECT',
        'افکت خانه برنده فعال شد.',
        {
          prizeCode:prizeCode,
          index:index
        }
      );

      // فقط برای تکمیل افکت برنده صبر می‌کنیم.
      // آپلود و وب‌هوک در این انتظار دخالت ندارند.

      await new Promise(resolveDelay=>{
        setTimeout(
          resolveDelay,
          WINNER_EFFECT_DURATION+100
        );
      });

      if(recordingSession){

        // توقف ضبط آغاز می‌شود؛ اما منتظر آپلود نمی‌مانیم.
        // اطلاعات نشست در متغیرهای مستقل خودش باقی می‌ماند.

        stopWheelRecording(recordingSession)
          .then(function(){

            recordingLog(
              'BACKGROUND VIDEO PROCESS FINISHED',
              'فرایند جانبی فیلم پایان یافت.',
              recordingSession.id
            );

          })
          .catch(function(error){

            // خطای جانبی هرگز نتیجه جایزه را تغییر نمی‌دهد.

            recordingLog(
              'BACKGROUND VIDEO PROCESS ERROR',
              'فرایند جانبی فیلم با خطا پایان یافت.',
              {
                sessionId:recordingSession.id,
                error:error
              }
            );

          });

      }else{

        recordingStatus.textContent='';
      }

      // انیمیشن پایان یافته است.
      // spinWheel اکنون می‌تواند جایزه را نمایش دهد.

      resolve();
    }

    function onTransitionEnd(event){

      if(event.target===svg){
        finish();
      }
    }

    svg.addEventListener(
      'transitionend',
      onTransitionEnd
    );

    svg.style.transform=
      'rotate('+currentRotation+'deg)';

    fallbackTimer=setTimeout(finish,7000);
  });
}

// ==========================================
// چرخش واقعی گردونه
// ==========================================

async function spinWheel(){

  if(spinning) return;

  if(!profileLoaded){

    status.textContent=
      'ابتدا باید اطلاعات پروفایل دریافت شود.';

    return;
  }

  if(remainingChances<=0){

    status.textContent=
      'شانس کافی برای چرخش ندارید.';

    return;
  }

  if(!spinApiUrl){

    status.textContent=
      '❌ لینک چرخش گردونه موجود نیست.';

    return;
  }

  spinning=true;

  spinBtn.disabled=true;
  spinBtn.textContent='⏳ در حال چرخش...';

  result.classList.remove('show');

  // دیگر ضبط قبلی را پاک نمی‌کنیم.
  // هر ضبط چرخه عمر مستقل خودش را دارد.

  clearWinnerEffect();

  status.textContent=
    'در حال ثبت چرخش و دریافت جایزه...';

  try{

    const response=await fetchWithTimeout(
      spinApiUrl,
      {
        method:'GET',
        cache:'no-store'
      },
      SPIN_TIMEOUT,
      'زمان دریافت نتیجه چرخش به پایان رسید.'
    );

    const data=await readApiResponse(response);

    if(data.ok!==true){

      throw new Error(
        data.message||'چرخش گردونه ناموفق بود.'
      );
    }

    if(!data.prize||!data.prize.code){

      throw new Error(
        'اطلاعات جایزه از سرور دریافت نشد.'
      );
    }

    const selectedPrize=prizes.find(
      prize=>prize.code===data.prize.code
    );

    if(!selectedPrize){

      throw new Error(
        'کد جایزه دریافتی معتبر نیست.'
      );
    }

    await animateToPrize(selectedPrize.code);

    // نمایش جایزه مستقل از ضبط، آپلود و ارسال فیلم است.

    resultTitle.textContent=
      '🎉 '+data.prize.name;

    resultDesc.textContent=
      'جایزه با موفقیت در سیستم ثبت شد.';

    result.classList.add('show');

    const updatedChances=Number(data.chances);

    if(
      data.chances!==undefined&&
      data.chances!==null&&
      data.chances!==''&&
      Number.isFinite(updatedChances)
    ){

      remainingChances=updatedChances;

      profileChances.textContent=
        '🎟️ شانس باقی‌مانده: '+remainingChances;

    }else{

      recordingLog(
        'CHANCES WARNING',
        'تعداد شانس جدید از پاسخ چرخش معتبر نبود؛ پروفایل دوباره دریافت می‌شود.',
        data.chances
      );

      await loadProfile();
    }

    if(data.samozal_games!==undefined){

      profileGames.textContent=
        '🎮 تعداد بازی‌ها: '+
        (Number(data.samozal_games)||0);
    }

    profileMessage.textContent=
      '✅ جایزه با موفقیت ثبت شد.';

    if(tg&&tg.HapticFeedback){

      tg.HapticFeedback.notificationOccurred(
        'success'
      );
    }

    if(remainingChances>0){

      spinBtn.textContent=
        '🎲 چرخاندن دوباره';

    }else{

      spinBtn.textContent=
        '🎲 شانس شما تمام شد';
    }

  }catch(error){

    status.textContent=
      '❌ '+(
        error.message||'خطا در اجرای چرخش گردونه.'
      );

    console.error('Spin API error:',error);

    await loadProfile();

  }finally{

    spinning=false;

    if(profileLoaded&&remainingChances>0){

      spinBtn.disabled=false;
      spinBtn.style.opacity='1';

      if(
        spinBtn.textContent!=='🎲 چرخاندن دوباره'
      ){

        spinBtn.textContent=
          '🎲 چرخاندن گردونه';
      }

    }else{

      spinBtn.disabled=true;
      spinBtn.style.opacity='.7';
    }
  }
}

// ==========================================
// شروع برنامه
// ==========================================

try{

  buildWheel();

  spinBtn.addEventListener(
    'click',
    spinWheel
  );

  loadProfile();

}catch(error){

  console.error(
    'Mini App startup error:',
    error
  );

  profileMessage.textContent=
    '❌ خطا در راه‌اندازی صفحه.';

  status.textContent=
    error.message||'خطای داخلی صفحه.';

  spinBtn.disabled=true;
}

})();
</script>
