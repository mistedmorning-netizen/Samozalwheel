<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>آزمایش انتقال فایل به TelebotHost</title>

    <style>
        body {
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 25px;
            background: #f2f2f2;
        }

        button {
            padding: 14px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #1769aa;
            color: white;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <h3>آزمایش انتقال فایل باینری</h3>

    <p>حجم فایل آزمایشی: ۱۰۰ کیلوبایت</p>

    <button onclick="sendTest()">
        ارسال فایل آزمایشی
    </button>

    <pre id="result">آماده ارسال...</pre>

    <script>

    async function sendTest() {

        var result = document.getElementById("result");

        result.textContent = "در حال آماده‌سازی فایل...";

        // آدرس وب‌هوک دستور vup
        var endpoint =
        "https://webapp.telebothost.com/ownlang/webhook/509194429820984?command=%2Fvup&sig=85207df476e1dfa94d08b84e0349ee358fa060166ad93f6023042523b1d967dd&expires=1795018166&gl=1";

        try {

            // ساخت فایل باینری ۱۰۰ کیلوبایتی
            var bytes = new Uint8Array(100 * 1024);

            for (var i = 0; i < bytes.length; i++) {
                bytes[i] = i % 256;
            }

            var testFile = new Blob(
                [bytes],
                {
                    type: "application/octet-stream"
                }
            );

            result.textContent =
                "در حال ارسال فایل...\n" +
                "File size: " + testFile.size + " bytes";

            // ارسال مستقیم فایل باینری
            var response = await fetch(endpoint, {

                method: "POST",

                headers: {
                    "Content-Type": "application/octet-stream"
                },

                body: testFile

            });

            var responseText = await response.text();

            result.textContent =
                "HTTP STATUS: " + response.status +
                "\n\n" +
                responseText;

        } catch (error) {

            result.textContent =
                "ERROR:\n" + error.message;

        }

    }

    </script>

</body>
</html>
