<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تست آپلود</title>
<style>
body {
  background:#191919;
  color:white;
  font-family:tahoma;
  text-align:center;
  padding:30px 15px;
}
.box {
  max-width:450px;
  margin:auto;
  padding:25px;
  background:#303030;
  border-radius:15px;
}
button {
  margin-top:20px;
  padding:13px 25px;
  background:#d6a52a;
  border:0;
  border-radius:8px;
  font-size:16px;
}
iframe {
  width:100%;
  height:220px;
  margin-top:20px;
  background:white;
  border:0;
}
</style>
</head>
<body>

<div class="box">
  <h3>آزمایش مستقیم آپلود ویدئو</h3>

  <form
    action="https://brewpage.app/api/files?ttl=1"
    method="POST"
    enctype="multipart/form-data"
    target="uploadResult">

    <input type="file" name="file" accept="video/*" required>

    <br>

    <button type="submit">آپلود ویدئو</button>
  </form>

  <iframe name="uploadResult"></iframe>
</div>

</body>
</html>
