<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آزمایش آپلود ویدئو</title>

<style>
body {
    font-family: Tahoma, sans-serif;
    background: #171717;
    color: white;
    text-align: center;
    padding: 25px 15px;
}
.box {
    max-width: 450px;
    margin: 40px auto;
    padding: 25px;
    background: #292929;
    border-radius: 15px;
}
button {
    background: #d6a52a;
    color: black;
    border: 0;
    padding: 13px 25px;
    border-radius: 8px;
    font-size: 16px;
    margin-top: 20px;
}
input {
    margin-top: 20px;
    max-width: 100%;
}
#result {
    margin-top: 25px;
    overflow-wrap: anywhere;
    line-height: 2;
}
a {
    color: #ffd45c;
}
</style>
</head>

<body>

<div class="box">
    <h2>آزمایش آپلود ویدئو</h2>

    <p>یک فایل ویدئویی انتخاب کن:</p>

    <input
        type="file"
        id="videoFile"
        accept="video/*"
    >

    <br>

    <button id="uploadBtn" onclick="uploadVideo()">
        آپلود ویدئو
    </button>

    <div id="result"></div>
</div>

<script>
async function uploadVideo() {

    const input = document.getElementById("videoFile");
    const button = document.getElementById("uploadBtn");
    const result = document.getElementById("result");

    const file = input.files[0];

    if (!file) {
        result.innerText = "ابتدا یک ویدئو انتخاب کن.";
        return;
    }

    if (file.size > 20 * 1024 * 1024) {
        result.innerText = "حجم فایل نباید بیشتر از ۲۰ مگابایت باشد.";
        return;
    }

    button.disabled = true;
    result.innerText = "در حال آپلود... لطفاً صبر کن.";

    try {

        const formData = new FormData();
        formData.append("file", file, file.name);

        const response = await fetch(
            "https://brewpage.app/api/files?ttl=1",
            {
                method: "POST",
                body: formData
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || data.message || "خطا در آپلود");
        }

        if (!data.link) {
            throw new Error("لینک فایل در پاسخ سرور وجود ندارد.");
        }

        result.innerHTML = `
            <p>✅ آپلود با موفقیت انجام شد.</p>
            <p>
                <a href="${data.link}" target="_blank">
                    مشاهده ویدئو
                </a>
            </p>
            <button onclick="copyLink('${data.link}')">
                کپی لینک
            </button>
        `;

    } catch (error) {

        result.innerText =
            "❌ خطا: " + error.message;

    } finally {

        button.disabled = false;

    }
}

async function copyLink(link) {
    try {
        await navigator.clipboard.writeText(link);
        alert("لینک کپی شد.");
    } catch (error) {
        alert("کپی خودکار انجام نشد.");
    }
}
</script>

</body>
</html>
